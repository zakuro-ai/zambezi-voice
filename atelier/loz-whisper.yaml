# L'Atelier job: Whisper-small (LoRA, Shona language token as a proxy) on Zambezi Voice Lozi (train@loz -> dev@loz).
# Replayable: `python -m sakura.atelier run atelier/loz.yaml --out runs/loz`  (see atelier/README.md).
# data.uri is the hub dataset; the runner presigns its files and rewrites the uri in the engine's
# copy only. For a local run, atelier/run.sh does the same rewrite to a directory.
atelier: 1
name: zambezi-voice-lozi-whisper-small
task: speech_recognition
data:
  uri: "zc://dataset/794cca0e-14ce-4a56-ae89-2cc49148b8b5@sha256:38794321cbaa9f1ebdef1ba85654bdedf1c48ad6928b3fa105f2878011ac2230"
  sha256: "7195d51f11aa83e79e6faf7793c398f3c6ee8620c3979fce904db7c4e3b92358"  # pins the manifest + every selected clip
  format: asr_manifest
  split:
    train: "train@loz"
    validation: "dev@loz"
features:
  inputs: [{name: audio, type: audio}]
  output: {name: transcript, type: text}
model: whisper-small
hp: speech_recognition/whisper-lora@1
overrides:
  language: sn            # Whisper has no Lozi; Shona is a related Bantu language (as in forge/asr-spec.yaml)
  epochs: 3
  batch_size: 8           # fp16, ~7 GB on the shared 2080 Ti; raise gradient_accumulation, not the batch, if memory is tight
  grad_accum: 2
  num_workers: 4
seed: 42
export: [safetensors]
placement: {strategy: best_price, gpus: 1, min_vram_gb: 8}
